name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # Runs every tests/*.test.js except e2e.test.js, which needs a live
        # TradingView Desktop with CDP. See scripts/run_offline_tests.js.
        run: npm test

      - name: Audit (high severity)
        run: npm audit --audit-level=high

  no-push-marker:
    # Fails a pull request that carries a commit whose message says do not
    # push. Same check as scripts/hooks/pre-push (ELI-694).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: scripts/hooks/check-no-push "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
